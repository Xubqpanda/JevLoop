<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JevLoop · 判定不花钱的 agent</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>⬢</text></svg>" />
    <!-- tokens 必须先于 app：app.css 只用 tokens.css 里的语义别名 -->
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="frame">
      <!--
        ── 左：导航 ────────────────────────────────────────

        工作区 → 会话两级，抄 DSH 的侧边栏（`ui-sidebar` + `ui-workspace`）。
        判定规格原来在这一栏，搬去了中栏的「规格」页 —— 侧边栏是**导航**，
        把一份要读的文档混在导航里，两件事都做不好。
      -->
      <aside class="pane side">
        <!--
          工作区：当前那个 + 一个切换菜单。没有工作区时显示「演示目录」——
          服务端没设 CWD_ROOT 时它自己造一个临时目录，那不是用户选的，
          所以不假装它是。
        -->
        <div class="ws-bar">
          <button class="ws-current" id="ws-current" aria-haspopup="listbox" aria-expanded="false">
            <span class="ws-dot" aria-hidden="true"></span>
            <span class="ws-text">
              <span class="ws-name" id="ws-name">读取中…</span>
              <span class="ws-path" id="ws-path"></span>
            </span>
            <span class="ws-caret" aria-hidden="true">▾</span>
          </button>
          <button class="ws-add" id="ws-add" title="添加工作区（选一个目录）" aria-label="添加工作区">+</button>
        </div>
        <div class="ws-menu" id="ws-menu" role="listbox" hidden></div>

        <div class="sess-head">
          <h2 class="section-title">会话</h2>
          <button class="sess-new" id="sess-new" title="新会话" aria-label="新会话">+</button>
        </div>
        <div class="sess-list" id="sess-list">
          <div class="empty">还没有会话</div>
        </div>

        <!--
          图例的行不写死在这里 —— 由 app.js 的 renderLegend() 按 EVENT_META 生成。

          上一版写死了五根 3px 色块，而屏幕上的轨迹早就是 19px 的文字徽章了。
          三样东西同时错：尺寸（3px vs 19px）、文案（「规则」在轨迹里叫「审计」
          和「预算」）、类名（`.swatch.rule` 在轨迹侧根本不存在）。

          三样全错却没有一处会报错 —— 因为图和被它描述的东西之间**没有任何
          机械联系**。现在有了：图例、时间轴、账本读同一张 EVENT_META。
        -->
        <div class="legend">
          <h2 class="section-title">图例</h2>
          <div id="legend-rows"></div>
        </div>

        <!--
          选目录的对话框。**形状抄 DSH 的 browse 后端**（
          `ui-directory-picker-browse`）：面包屑每一节可跳、只列目录、
          每个条目带绝对路径、可以就地新建子目录。
        -->
        <div class="picker-mask" id="picker-mask" hidden>
          <div class="picker" role="dialog" aria-modal="true" aria-labelledby="picker-title">
            <div class="picker-head">
              <span id="picker-title">选一个目录</span>
              <button class="picker-x" id="picker-x" aria-label="关闭">×</button>
            </div>
            <div class="picker-crumbs" id="picker-crumbs"></div>
            <div class="picker-entries" id="picker-entries"></div>
            <div class="picker-note" id="picker-note"></div>
            <div class="picker-foot">
              <input class="picker-new" id="picker-new" placeholder="在这里新建子目录…" spellcheck="false" />
              <button class="picker-mk" id="picker-mk">新建</button>
              <button class="picker-pick" id="picker-pick">用这个目录</button>
            </div>
          </div>
        </div>
      </aside>

      <!-- ── 中：对话 / 轨迹 ──────────────────────────────── -->
      <main class="pane center">
        <!-- DSH 里没有全局顶栏：头部属于中栏的占用者，计数也在这里 -->
        <header class="conv-header">
          <div class="tabs" role="tablist" aria-label="视图">
            <button class="tab" role="tab" id="tab-chat" data-view="chat" aria-selected="true">对话</button>
            <button class="tab" role="tab" id="tab-trace" data-view="trace" aria-selected="false">轨迹</button>
            <button class="tab" role="tab" id="tab-spec" data-view="spec" aria-selected="false">规格</button>
          </div>
          <div class="header-right">
            <!-- 四个计数就是全部主张：判定很多次，模型很少次 -->
            <div class="tally">
              <span class="tally-item decide">判定 <b id="t-decide">0</b></span>
              <span class="tally-item rule">规则 <b id="t-rules">0</b></span>
              <span class="tally-item tool">工具 <b id="t-tool">0</b></span>
              <span class="tally-item model">模型 <b id="t-model">0</b></span>
            </div>
            <button class="badge action" id="new-session">新对话</button>
            <button class="badge action" id="theme">深色</button>
          </div>
        </header>

        <!-- 对话 -->
        <section class="view" id="view-chat" role="tabpanel" aria-labelledby="tab-chat">
          <!--
            holder 是滚动内容和两个悬浮件共同的定位上下文。
            按钮和轨道挂在滚动区**外面** —— 挂里面的话它们会跟着内容滚走。
          -->
          <div class="stream-holder">
            <div class="stream" id="stream">
              <div class="stream-inner" id="chat">
                <div class="empty">说点什么，它会边判定边做。</div>
              </div>
            </div>

            <!-- 一次用户输入一个刻度，点它跳过去（DSH 的 TurnNavigator） -->
            <nav class="turn-rail" id="turn-rail" aria-label="跳转到某次输入" hidden>
              <div class="turn-rail-scroller" id="turn-rail-scroller"></div>
            </nav>

            <!-- 只在离开底部时出现（DSH 的 toBottom） -->
            <div class="to-bottom-slot">
              <button class="to-bottom" id="to-bottom" type="button" title="回到最新" aria-label="回到最新" hidden>↓</button>
            </div>
          </div>

          <form class="composer" id="composer">
            <div class="composer-card">
              <div class="composer-scroll">
                <textarea
                  class="composer-input"
                  id="task"
                  rows="1"
                  spellcheck="false"
                  placeholder="让它做点什么…"
                >列出工作目录里的文件，读取其中的 TypeScript 文件，说明它定义了哪些函数</textarea>
              </div>
              <div class="composer-row">
                <span class="composer-hint">Enter 发送 · Shift+Enter 换行</span>
                <button class="send" id="run" type="submit" title="发送" aria-label="发送">↑</button>
              </div>
            </div>
          </form>
        </section>

        <!--
          规格：这份 agent 会问哪些问题。**从服务端读 DECISION.md 的解析结果**
          —— 它和 `src/decisions.ts` 是同一份东西的两面，测试盯着它们不许分叉。
        -->
        <section class="view" id="view-spec" role="tabpanel" aria-labelledby="tab-spec" hidden>
          <div class="spec-pane">
            <h2 class="section-title">DECISION.md</h2>
            <div id="spec"><div class="empty">读取中…</div></div>
          </div>
        </section>

        <!-- 轨迹：和对话看的是同一串事件，只是不折叠 -->
        <section class="view" id="view-trace" role="tabpanel" aria-labelledby="tab-trace" hidden>
          <div class="trace-wrap">
            <!-- 时间轴：三条泳道，横轴是真实耗时 -->
            <div class="plot">
              <div class="plot-labels"><span>判定</span><span>工具</span><span>模型</span></div>
              <div class="plot-track" id="plot-track">
                <div class="plot-lanes" id="plot-lanes"></div>
                <div class="plot-empty" id="plot-empty">还没有跑过</div>
              </div>
            </div>

            <div class="split">
              <div class="table-pane">
                <table class="traj">
                  <thead>
                    <tr>
                      <th class="col-event">事件</th>
                      <th>内容</th>
                    </tr>
                  </thead>
                  <tbody id="traj-body">
                    <tr>
                      <td colspan="2" class="empty">切回「对话」发一条，这里会按行记下来。</td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <!-- 详情：选中某一行时显示它的全部内容 -->
              <aside class="details">
                <div class="details-header">
                  <div class="details-title"><span id="detail-title">详情</span></div>
                  <span class="details-location" id="detail-location"></span>
                </div>
                <div class="detail-tabs" role="tablist" id="detail-tabs"></div>
                <div class="detail-body" id="detail-body">
                  <div class="detail-empty">点左边任意一行</div>
                </div>
              </aside>
            </div>
          </div>
        </section>
      </main>

      <!-- ── 右：记账 ─────────────────────────────────────── -->
      <aside class="pane aside">
        <h2 class="section-title">记账</h2>
        <div id="side-stats">
          <div class="empty">运行结束后显示</div>
        </div>
      </aside>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
